<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заявка на материалы</title>
    <!-- Подключаем скрипт Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            margin: 0;
            padding: 16px;
        }
        h2 { font-size: 18px; margin-bottom: 8px; }
        .info-box {
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 12px;
        }
        label { display: block; font-size: 12px; margin-bottom: 4px; color: gray; }
        input, select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }
        button {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        .item-card {
            background: var(--tg-theme-secondary-bg-color, #f9f9f9);
            padding: 8px;
            border-radius: 6px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .delete-btn {
            background: #ff3b30;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            width: auto;
            margin: 0;
        }
    </style>
</head>
<body>

    <h2>📦 Добавление материалов</h2>
    
    <div class="info-box" id="infoBox">
        Загрузка параметров...
    </div>

    <div class="form-group">
        <label>Название материала:</label>
        <input type="text" id="matName" placeholder="например, Кабель ВВГнг 3х1.5">
    </div>

    <div class="form-group" style="display: flex; gap: 10px;">
        <div style="flex: 2;">
            <label>Количество:</label>
            <input type="number" id="matQty" placeholder="0">
        </div>
        <div style="flex: 1;">
            <label>Ед. изм.:</label>
            <select id="matUnit">
                <option value="шт">шт</option>
                <option value="м">м</option>
                <option value="м²">м²</option>
                <option value="кг">кг</option>
                <option value="упак">упак</option>
            </select>
        </div>
    </div>

    <div class="form-group">
        <label>Примечание (необязательно):</label>
        <input type="text" id="matNote" placeholder="например, ГОСТ, цвет и т.д.">
    </div>

    <button onclick="addItem()">➕ Добавить позицию</button>

    <h3 style="margin-top: 20px; font-size: 16px;">Список позиций:</h3>
    <div id="itemsList">
        <p style="color: gray; font-size: 13px;" id="emptyText">Список пуст</p>
    </div>

    <button id="submitBtn" onclick="submitOrder()" style="background-color: #34c759; display: none; margin-top: 20px;">✅ Отправить заявку в снабжение</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // 1. Читаем параметры из URL (строго фиксированные ключи)
        const urlParams = new URLSearchParams(window.location.search);
        const projId = urlParams.get('proj_id');
        const section = urlParams.get('section');
        const date = urlParams.get('date');

        // Выводим информацию на экран, чтобы сразу проверить, правильно ли они встали
        document.getElementById('infoBox').innerHTML = `
            📂 <b>Раздел:</b> ${section || 'Не указан'}<br>
            📅 <b>Дата поставки:</b> ${date || 'Не указана'}
        `;

        let selectedItems = [];

        function addItem() {
            const name = document.getElementById('matName').value.trim();
            const qty = parseFloat(document.getElementById('matQty').value);
            const unit = document.getElementById('matUnit').value;
            const note = document.getElementById('matNote').value.trim();

            if (!name || isNaN(qty) || qty <= 0) {
                alert('Пожалуйста, введите название и корректное количество материала!');
                return;
            }

            selectedItems.push({ name, qty, unit, note });

            // Очищаем поля ввода
            document.getElementById('matName').value = '';
            document.getElementById('matQty').value = '';
            document.getElementById('matNote').value = '';

            renderItems();
        }

        function removeItem(index) {
            selectedItems.splice(index, 1);
            renderItems();
        }

        function renderItems() {
            const listContainer = document.getElementById('itemsList');
            const emptyText = document.getElementById('emptyText');
            const submitBtn = document.getElementById('submitBtn');

            if (selectedItems.length === 0) {
                listContainer.innerHTML = '<p style="color: gray; font-size: 13px;" id="emptyText">Список пуст</p>';
                submitBtn.style.display = 'none';
                return;
            }

            let html = '';
            selectedItems.forEach((item, index) => {
                html += `
                    <div class="item-card">
                        <div>
                            <b>${item.name}</b> — ${item.qty} ${item.unit}
                            ${item.note ? `<br><small style="color:gray;">${item.note}</small>` : ''}
                        </div>
                        <button class="delete-btn" onclick="removeItem(${index})">❌</button>
                    </div>
                `;
            });

            listContainer.innerHTML = html;
            submitBtn.style.display = 'block';
        }

        // 2. Отправка данных обратно боту строго в правильном формате
        function submitOrder() {
            if (selectedItems.length === 0) return;

            const payload = {
                proj_id: projId,
                section: section,   // Передаем именно раздел
                date: date,         // Передаем именно дату
                items: selectedItems
            };

            // Отправляем JSON обратно в Telegram-бота
            tg.sendData(JSON.stringify(payload));
        }
    </script>
</body>
</html>
