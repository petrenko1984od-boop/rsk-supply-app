<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSK Odessa - Диаграмма Ганта</title>
    <!-- Подключаем стили Frappe Gantt -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/frappe-gantt/0.6.1/frappe-gantt.css">
    <!-- Подключаем Tailwind CSS для красивого оформления интерфейса -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f3f4f6;
        }
        /* Кастомизация графика под дизайн Telegram */
        .gantt .bar-progress {
            fill: #3b82f6;
        }
        .gantt .bar {
            fill: #93c5fd;
        }
        .gantt .bar-wrapper:hover .bar {
            fill: #60a5fa;
        }
    </style>
</head>
<body class="p-4">

    <div class="max-w-6xl mx-auto bg-white rounded-xl shadow-md p-6">
        <div class="flex flex-col md:flex-row justify-between items-center mb-6 border-b pb-4">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">🏗 График выполнения проектов</h1>
                <p class="text-sm text-gray-500">Управление сроками и этапами строительства (RSK Odessa)</p>
            </div>
            <!-- Переключатели масштаба времени -->
            <div class="flex gap-2 mt-4 md:mt-0">
                <button onclick="gantt.change_view_mode('Day')" class="px-3 py-1.5 text-xs font-semibold bg-gray-100 hover:bg-blue-500 hover:text-white rounded-lg transition">День</button>
                <button onclick="gantt.change_view_mode('Week')" class="px-3 py-1.5 text-xs font-semibold bg-gray-100 hover:bg-blue-500 hover:text-white rounded-lg transition">Неделя</button>
                <button onclick="gantt.change_view_mode('Month')" class="px-3 py-1.5 text-xs font-semibold bg-gray-100 hover:bg-blue-500 hover:text-white rounded-lg transition">Месяц</button>
            </div>
        </div>

        <!-- Контейнер для самой диаграммы Ганта -->
        <div class="overflow-x-auto border rounded-lg p-2 bg-white">
            <svg id="gantt"></svg>
        </div>
        
        <div class="mt-4 text-xs text-gray-400 text-center">
            Нажмите на задачу на графике, чтобы посмотреть подробности.
        </div>
    </div>

    <!-- Подключаем библиотеку Frappe Gantt -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/frappe-gantt/0.6.1/frappe-gantt.min.js"></script>
    <script>
        // Данные задач по объектам (в будущем можно подтягивать через API из вашего бота/бд)
        const tasks = [
            {
                id: '1',
                name: 'Объект №1: Фундаментные работы',
                start: '2026-09-01',
                end: '2026-09-10',
                progress: 80,
                dependencies: ''
            },
            {
                id: '2',
                name: 'Объект №1: Возведение стен',
                start: '2026-09-11',
                end: '2026-09-25',
                progress: 20,
                dependencies: '1'
            },
            {
                id: '3',
                name: 'Объект №2: Монтаж металлокаркаса',
                start: '2026-09-05',
                end: '2026-09-18',
                progress: 45,
                dependencies: ''
            },
            {
                id: '4',
                name: 'Объект №3: Кровельные работы',
                start: '2026-09-15',
                end: '2026-09-30',
                progress: 0,
                dependencies: ''
            },
            {
                id: '5',
                name: 'Объект №4: Подвод коммуникаций',
                start: '2026-09-20',
                end: '2026-10-05',
                progress: 0,
                dependencies: ''
            }
        ];

        // Инициализация диаграммы Ганта
        const gantt = new Gantt("#gantt", tasks, {
            header_height: 50,
            column_width: 30,
            step: 24,
            view_modes: ['Day', 'Week', 'Month'],
            bar_height: 25,
            bar_corner_radius: 4,
            arrow_curve: 5,
            padding: 18,
            view_mode: 'Week',
            language: 'ru',
            // Обработчик клика по задаче
            onClick: function (task) {
                alert(`Задача: ${task.name}\nСроки: с ${task.start} по ${task.end}\nВыполнено: ${task.progress}%`);
            },
            // Обработчик изменения сроков прямо на графике (если пользователь перетащит полоску мышкой)
            on_date_change: function(task, start, end) {
                console.log(task, start, end);
            },
            on_progress_change: function(task, progress) {
                console.log(task, progress);
            }
        });
    </script>
</body>
</html>
