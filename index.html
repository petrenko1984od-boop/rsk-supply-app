
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заявка на материалы</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; padding: 16px; background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #000); }
        .item-row { background: rgba(0,0,0,0.03); padding: 10px; border-radius: 8px; margin-bottom: 10px; }
        input, select { width: 100%; padding: 8px; margin: 4px 0 10px 0; box-sizing: border-box; }
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 5px; }
        .btn-add { background: #e0e0e0; }
        .btn-submit { background: #2481cc; color: white; margin-top: 15px; }
    </style>
</head>
<body>

    <h3>📦 Создание заявки</h3>
    <div id="info" style="font-size: 13px; margin-bottom: 15px; opacity: 0.8;">Загрузка параметров...</div>

    <div id="items-container"></div>

    <button type="button" class="btn-add" onclick="addItemRow()">➕ Добавить позицию</button>
    <button type="button" class="btn-submit" onclick="submitOrder()">✅ Отправить заявку боту</button>

    <script>
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();

        const urlParams = new URLSearchParams(window.location.search);
        const projId = urlParams.get('proj_id');
        const section = urlParams.get('section');
        const date = urlParams.get('date');

        document.getElementById('info').innerHTML = `<b>Объект ID:</b> ${projId} | <b>Раздел:</b> ${section} | <b>Дата:</b> ${date}`;

        window.onload = function() {
            addItemRow();
        };

        function addItemRow() {
            const container = document.getElementById('items-container');
            const id = Date.now();
            const div = document.createElement('div');
            div.className = 'item-row';
            div.id = `row-${id}`;
            div.innerHTML = `
                <label>Материал:</label>
                <input type="text" class="mat-name" placeholder="Например: Цемент">
                <div style="display:flex; gap:8px;">
                    <div style="flex:1;"><label>Кол-во:</label><input type="number" class="mat-qty" value="1"></div>
                    <div style="flex:1;"><label>Ед:</label>
                        <select class="mat-unit">
                            <option value="шт">шт</option>
                            <option value="меш">меш</option>
                            <option value="м3">м3</option>
                            <option value="т">т</option>
                        </select>
                    </div>
                </div>
                <button type="button" style="background:#ff3b30; color:white; padding:4px; font-size:11px;" onclick="document.getElementById('row-${id}').remove()">Удалить</button>
            `;
            container.appendChild(div);
        }

        function submitOrder() {
            const rows = document.querySelectorAll('.item-row');
            const items = [];

            rows.forEach(row => {
                const name = row.querySelector('.mat-name').value.trim();
                const qty = row.querySelector('.mat-qty').value.trim();
                const unit = row.querySelector('.mat-unit').value;
                if (name) {
                    items.push({ name: name, qty: parseFloat(qty) || 1, unit: unit, note: "" });
                }
            });

            if (items.length === 0) {
                alert('Добавьте хотя бы один материал!');
                return;
            }

            const payload = {
                proj_id: projId ? parseInt(projId) : 0,
                section: section || "Общий раздел",
                date: date || "Не указана",
                items: items
            };

            // Проверка перед отправкой
            console.log("Отправка данных:", payload);
            
            // Передаем данные боту
            Telegram.WebApp.sendData(JSON.stringify(payload));
        }
    </script>
</body>
</html>
