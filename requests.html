<script>
    // Читаем параметры из URL, которые передал бот
    const urlParams = new URLSearchParams(window.location.search);
    const project = urlParams.get('proj') || 'Объект №1';
    const section = urlParams.get('sec') || 'Общие';
    const date = urlParams.get('date') || 'Срочно';

    // Автоматически заполняем или подставляем их в форму заявки
    document.getElementById('modal-project').value = project;

    function submitMaterial(event) {
        event.preventDefault();
        const material = document.getElementById('modal-material').value;
        const qty = document.getElementById('modal-qty').value;
        
        // Данные готовой заявки
        const requestData = {
            project: project,
            section: section,
            date: date,
            material: material,
            quantity: qty,
            status: "🔴 Новая"
        };

        // Если открыто внутри Telegram Web App, отправляем данные боту
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.sendData(JSON.stringify(requestData));
            window.Telegram.WebApp.close();
        } else {
            alert('Заявка успешно сформирована!');
            console.log(requestData);
        }
    }
</script>
