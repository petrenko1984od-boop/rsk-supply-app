<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSK Odessa - Ввод материалов</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="bg-gray-50 p-4 max-w-lg mx-auto font-sans">

    <div class="bg-white rounded-xl shadow-md p-6 mt-4">
        <h2 class="text-xl font-bold text-gray-800 mb-2">📦 Добавление материалов</h2>
        <div id="info-block" class="text-xs text-gray-500 bg-gray-100 p-3 rounded-lg mb-4">
            Загрузка параметров...
        </div>

        <form id="material-form" onsubmit="submitMaterial(event)">
            <div class="mb-4">
                <label class="block text-xs font-semibold text-gray-600 mb-1">Наименование материала:</label>
                <input type="text" id="mat-name" required placeholder="например, Кабель ВВГнг 3х2.5" class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div class="mb-4">
                <label class="block text-xs font-semibold text-gray-600 mb-1">Количество и ед. измерения:</label>
                <input type="text" id="mat-qty" required placeholder="например, 100 м" class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div class="flex gap-2">
                <button type="submit" id="submit-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg text-sm transition shadow">✅ Отправить в снабжение</button>
            </div>
        </form>
    </div>

    <script>
        // Инициализация Telegram Web App
        let tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Читаем параметры из URL
        const urlParams = new URLSearchParams(window.location.search);
        const project = urlParams.get('proj') || 'Не указан';
        const section = urlParams.get('sec') || 'Не указан';
        const date = urlParams.get('date') || 'Срочно';

        // Отображаем параметры на форме
        document.getElementById('info-block').innerHTML = `
            🏢 Объект: <b>${project}</b><br>
            📁 Раздел: <b>${section}</b><br>
            ⏳ Дата поставки: <b>${date}</b>
        `;

        function submitMaterial(event) {
            event.preventDefault();
            
            const material = document.getElementById('mat-name').value.trim();
            const quantity = document.getElementById('mat-qty').value.trim();
            
            if (!material || !quantity) {
                alert('Пожалуйста, заполните все поля!');
                return;
            }

            const orderData = {
                project: project,
                section: section,
                date: date,
                material: material,
                quantity: quantity
            };

            // Блокируем кнопку на случай повторного нажатия
            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.innerText = "⏳ Отправка...";

            if (tg && tg.sendData) {
                // Отправляем данные боту
                tg.sendData(JSON.stringify(orderData));
                
                // Делаем микро-паузу перед закрытием окна, чтобы данные успели уйти
                setTimeout(() => {
                    tg.close();
                }, 300);
            } else {
                alert('Ошибка: Telegram WebApp недоступен');
                btn.disabled = false;
                btn.innerText = "✅ Отправить в снабжение";
            }
        }
    </script>
</body>
</html>
